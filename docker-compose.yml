services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: labelme_web
      POSTGRES_USER: labelme
      POSTGRES_PASSWORD: labelme_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labelme -d labelme_web"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - labelme_storage:/app/data/storage
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --workers 2"

volumes:
  postgres_data:
  labelme_storage:
